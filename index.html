    html, body {

    canvas {

      content: "";

      pointer-events: none;
      z-index: 100;
      border-radius: 4% / 3%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.8) 100%);
      box-shadow: 0 0 0 100vmax #000, inset 0 0 80px rgba(0, 0, 0, 0.4);
